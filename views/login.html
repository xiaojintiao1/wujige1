<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>登录</title>
<style>body{display:flex;align-items:center;justify-content:center;height:100vh;background:#f5f5f5;font-family:sans-serif}
.box{background:#fff;padding:2rem;border-radius:12px;width:320px;text-align:center}
input{width:100%;padding:12px;margin:1rem 0;border:1px solid #ddd;border-radius:8px}
button{width:100%;padding:12px;background:#ff2d55;color:#fff;border:none;border-radius:8px}</style>
</head>
<body>
<div class="box">
  <h3>管理后台登录</h3>
  <form method="POST" action="/admin/login">
    <input type="password" name="password" placeholder="密码" required>
    <button>登录</button>
  </form>
  <p style="color:#999;font-size:12px;margin-top:1rem">默认密码 admin123</p>
</div>
</body>
</html>
