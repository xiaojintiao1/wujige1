<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TK-北冥工作室</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f7f8fc;color:#333;min-height:100vh}
header{background:#fff;padding:0.9rem 4%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.06);position:sticky;top:0;z-index:100}
.logo{font-size:1.35rem;font-weight:700;color:#ff2d55;display:flex;align-items:center;gap:6px}
nav{display:flex;align-items:center;gap:1.8rem}
nav a{text-decoration:none;color:#555;font-size:0.95rem}
.login-btn{background:#ff2d55;color:#fff!important;padding:7px 18px;border-radius:20px;font-weight:500}
.hero-bg{background:linear-gradient(180deg,#f7f8fc 0%,#eef1f8 100%);position:relative;overflow:hidden}
.container{max-width:1100px;margin:0 auto;padding:2rem 1rem 4rem}
.announce-card{background:#fff;border-radius:16px;padding:1.8rem 2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);position:relative;z-index:2;max-width:680px}
.announce-card h3{color:#ff2d55;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.announce-content{white-space:pre-line;line-height:1.85;font-size:0.95rem;color:#444}
.contact-inline{margin-top:1.2rem;font-size:0.95rem;line-height:1.7}
.products-title{margin:2.5rem 0 1.2rem;font-size:1.4rem}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.4rem}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:150px;object-fit:cover;background:#f0f0f0}
.card .info{padding:1.1rem}
.price{color:#ff2d55;font-weight:700;margin-top:.6rem;font-size:1.15rem}
footer{text-align:center;padding:2rem;color:#999;font-size:0.85rem}
@media(max-width:768px){nav{gap:1rem;font-size:0.9rem}.announce-card{padding:1.4rem}}
</style>
</head>
<body>
<header>
  <div class="logo">🎵 <span id="siteName">TK-北冥工作室</span></div>
  <nav>
    <a href="#products">购物中心</a>
    <a href="#orders">订单查询</a>
    <a href="/admin" class="login-btn">登录</a>
  </nav>
</header>

<div class="hero-bg">
  <div class="container">
    <div class="announce-card">
      <h3>📢 最新公告</h3>
      <div class="announce-content" id="announcement">加载中...</div>
      <div class="contact-inline" id="contactInfo"></div>
    </div>
  </div>
</div>

<div class="container">
  <h2 class="products-title" id="products">商品展示</h2>
  <div class="products" id="productList"></div>
  <div id="orders" style="margin-top:3rem;background:#fff;padding:1.5rem;border-radius:12px">
    <h3>订单查询</h3>
    <p style="color:#888;margin-top:.5rem">请联系客服查询订单状态（QQ / TG / 微信）</p>
  </div>
</div>

<footer>© 2026 TK-北冥工作室</footer>

<script>
async function load(){
  try{
    const d = await (await fetch('/api/content')).json();
    document.getElementById('siteName').textContent = d.siteName || 'TK-北冥工作室';
    document.title = d.siteName || 'TK-北冥工作室';
    document.getElementById('announcement').textContent = (d.announcement||'').replace(/\\n/g,'\n');
    document.getElementById('contactInfo').innerHTML = `
      <strong>QQ:</strong> ${d.qq||'-'} &nbsp;|&nbsp; 
      <strong>TG:</strong> ${d.tg||'-'} &nbsp;|&nbsp; 
      <strong>V/微信:</strong> ${d.wechat||'-'}<br>
      <strong>上班时间:</strong> ${d.workTime||'9:00-21:00'}
    `;
    document.getElementById('productList').innerHTML = (d.products||[]).map(p=>`
      <div class="card">
        ${p.image ? `<img src="${p.image}" alt="">` : '<div style="height:150px;background:#f5f5f5"></div>'}
        <div class="info">
          <h3>${p.name||'商品'}</h3>
          <p style="color:#666;margin-top:.4rem;font-size:0.92rem">${p.desc||''}</p>
          <div class="price">${p.price||'面议'}</div>
        </div>
      </div>
    `).join('') || '<p style="color:#999">暂无商品，请在后台添加</p>';
  }catch(e){ console.error(e); }
}
load();
</script>
</body>
</html>
