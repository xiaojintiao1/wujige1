<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>乌鸡哥</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f7f8fc;color:#333;min-height:100vh}
header{background:#fff;padding:0.9rem 4%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 6px rgba(0,0,0,.06);position:sticky;top:0;z-index:100}
.logo{font-size:1.35rem;font-weight:700;color:#ff2d55;display:flex;align-items:center;gap:6px}
.hero-bg{background:linear-gradient(180deg,#f7f8fc 0%,#eef1f8 100%);}
.container{max-width:800px;margin:0 auto;padding:3rem 1rem 4rem}
.announce-card{background:#fff;border-radius:16px;padding:2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.announce-card h3{color:#ff2d55;margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.announce-content{white-space:pre-line;line-height:1.85;font-size:0.95rem;color:#444}
.contact-inline{margin-top:1.5rem;font-size:0.95rem;line-height:1.8;padding-top:1rem;border-top:1px solid #eee}
footer{text-align:center;padding:2rem;color:#999;font-size:0.85rem}
</style>
</head>
<body>
<header>
  <div class="logo">🎵 <span id="siteName">乌鸡哥</span></div>
</header>

<div class="hero-bg">
  <div class="container">
    <div class="announce-card">
      <h3>📢 最新公告</h3>
      <div class="announce-content" id="announcement">加载中...</div>
      <div class="contact-inline" id="contactInfo"></div>
    </div>
  </div>
</div>

<footer>© 2026 乌鸡哥</footer>

<script>
async function load(){
  try{
    const d = await (await fetch('/api/content')).json();
    document.getElementById('siteName').textContent = d.siteName || '乌鸡哥';
    document.title = d.siteName || '乌鸡哥';
    document.getElementById('announcement').textContent = (d.announcement||'').replace(/\\n/g,'\n');
    document.getElementById('contactInfo').innerHTML = `
      <strong>QQ:</strong> ${d.qq||'-'} &nbsp;|&nbsp; 
      <strong>TG:</strong> ${d.tg||'-'} &nbsp;|&nbsp; 
      <strong>V/微信:</strong> ${d.wechat||'-'}<br>
      <strong>上班时间:</strong> ${d.workTime||'9:00-21:00'}
    `;
  }catch(e){ console.error(e); }
}
load();
</script>
</body>
</html>
